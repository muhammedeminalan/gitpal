name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Araç sürümleri
        run: |
          go version
          git --version
      - name: Derle
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  coverage:
    name: coverage (internal/core >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Kapsam eşiği
        run: make cover

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tags: gui,production,webkit2_41
          - os: macos-latest
            tags: gui,production
            # Wails'in kullandığı UTType bu framework'te; wails CLI'sı da böyle bağlıyor.
            ldflags: -framework UniformTypeIdentifiers
          - os: windows-latest
            tags: gui,production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux arayüz kütüphaneleri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend (tip kontrolü + derleme)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: gitpal-gui derle
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: ${{ matrix.ldflags }}
        run: go build -tags '${{ matrix.tags }}' -o gitpal-gui-bin ./cmd/gitpal-gui

  install:
    # Kurulum betikleri: yerel sunucudaki sahte bir sürümü indirip
    # sağlama toplamıyla doğrulayarak kurabiliyor mu?
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Sahte sürüm hazırla
        shell: bash
        run: |
          set -eu
          os=$(go env GOOS); arch=$(go env GOARCH)
          mkdir -p rel
          if [ "$os" = windows ]; then
            CGO_ENABLED=0 go build -o rel/gitpal.exe ./cmd/gitpal
            (cd rel && pwsh -NoProfile -Command "Compress-Archive -Path gitpal.exe -DestinationPath gitpal_0.0.0-test_${os}_${arch}.zip" && rm gitpal.exe)
          else
            CGO_ENABLED=0 go build -o rel/gitpal ./cmd/gitpal
            (cd rel && tar czf "gitpal_0.0.0-test_${os}_${arch}.tar.gz" gitpal && rm gitpal)
          fi
          (cd rel && if command -v sha256sum >/dev/null; then sha256sum gitpal_*; else shasum -a 256 gitpal_*; fi > checksums.txt)
          cat rel/checksums.txt
      - name: Sunucuyu başlat
        shell: bash
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          (cd rel && "$py" -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/checksums.txt >/dev/null && exit 0; sleep 1; done; exit 1
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          GITPAL_VERSION: 0.0.0-test
          GITPAL_BASE_URL: http://127.0.0.1:8765
          GITPAL_PREFIX: ${{ runner.temp }}/gitpal-bin
        run: |
          sh scripts/install.sh
          "$GITPAL_PREFIX/gp" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITPAL_VERSION: 0.0.0-test
          GITPAL_BASE_URL: http://127.0.0.1:8765
          GITPAL_PREFIX: ${{ runner.temp }}\gitpal-bin
        run: |
          ./scripts/install.ps1
          & "$env:GITPAL_PREFIX\gp.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Araç sürümleri
        run: |
          go version
          git --version
      - name: Derle
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  coverage:
    name: coverage (internal/core >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Kapsam eşiği
        run: make cover

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tags: gui,production,webkit2_41
          - os: macos-latest
            tags: gui,production
            # Wails'in kullandığı UTType bu framework'te; wails CLI'sı da böyle bağlıyor.
            ldflags: -framework UniformTypeIdentifiers
          - os: windows-latest
            tags: gui,production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux arayüz kütüphaneleri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend (tip kontrolü + derleme)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: gitpal-gui derle
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: ${{ matrix.ldflags }}
        run: go build -tags '${{ matrix.tags }}' -o gitpal-gui-bin ./cmd/gitpal-gui
